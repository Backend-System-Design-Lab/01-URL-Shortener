global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    scrape_interval: 5s

    static_configs:
      - targets:
          - app1:8080

        labels:
          environment: local-multi
          app_instance: app1

      - targets:
          - app2:8080

        labels:
          environment: local-multi
          app_instance: app2